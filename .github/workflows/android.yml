name: build-android-apk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Android/**"
      - "agent/**"
      - "assets/**"
      - "tools/*android*.py"
      - "tests/test_android*.py"
      - "tests/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: ["codex/android-app"]
    paths:
      - "Android/**"
      - "agent/**"
      - "assets/**"
      - "tools/*android*.py"
      - "tests/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          # 默认包列表包含已不可用的旧 tools，这里只安装当前需要的平台工具。
          packages: 'platform-tools'
      - name: Install SDK and NDK
        run: |
          ndk=$(python -c 'import json; print(json.load(open("Android/versions.json"))["ndk"])')
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;$ndk"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Android/.cache
            Android/MaaFwApp/.maafw
            Android/MaaFwApp/.maa-cache
          key: android-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Android/versions.json', 'tools/build_android_opencv.py', 'Android/MaaFwApp') }}
      - name: Check Android regressions
        run: |
          python -m pip install numpy opencv-python-headless onnxruntime
          python -m unittest discover -s tests -p 'test_android*.py' -v
      - name: Build APK
        env:
          BUILD_ABI: ${{ matrix.abi }}
        run: python tools/build_android.py --abi "$BUILD_ABI"
      - name: Check PI with Android parser and run-plan builder
        run: python tools/check_android_interface.py
      - name: Check Android shell fixes
        working-directory: Android/MaaFwApp
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          --tests 'com.aliothmoon.maafw.project.PiInstaller*'
          --tests 'com.aliothmoon.maafw.overlay.screensaver.ScreenSaver*Test'
          --tests 'com.aliothmoon.maafw.settings.SettingsViewModelTest'
          --tests 'com.aliothmoon.maafw.remote.MaaRunnerControllerTargetTest'
      - uses: actions/upload-artifact@v7
        with:
          name: MaaFGO-android-${{ matrix.abi }}-debug
          path: Android/out/*.apk
          if-no-files-found: error
          compression-level: 0
